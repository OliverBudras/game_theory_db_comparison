<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Field-Level Network</title>
<style>
html, body { margin:0; padding:0; height:100%; width:100%; font-family:Arial, sans-serif; }
#window-controls {
  position:fixed;
  bottom:20px; /* pushed slightly above bottom */
  left:0;
  right:0;
  height:100px;
  background:#f0f0f0;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px;
}
#window-slider-container {
  position:relative;
  width:90%;
  height:30px;
}
#slider-line {
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:4px;
  background:#ccc;
  transform:translateY(-50%);
  border-radius:2px;
  z-index:1;
}
#slider-points {
  position:relative;
  width:100%;
  height:30px;
  z-index:2;
}
.slider-point {
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%);
  width:12px;
  height:12px;
  border-radius:50%;
  background:#ccc;
  cursor:pointer;
}
.slider-point.active { background:#007bff; }
.tick-label {
  position:absolute;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  white-space: nowrap;
}

#node-info-oa, #node-info-wos {
  position: fixed;
  bottom: 150px;
  width: 300px;
  max-height: 60vh;
  padding: 15px;
  border: 1px solid #ccc;
  background: rgba(255,255,255,0.95);
  overflow-y: auto;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  display: none;
  z-index: 10;
}
#node-info-oa { left: 20px; }
#node-info-wos { left: calc(50% + 20px); }

#node-info-oa .field { display:flex; align-items:flex-start; margin-bottom:4px; }
#node-info-oa .label { font-weight:bold; min-width:90px; flex-shrink:0; }
#node-info-oa .value { flex:1; word-break:break-word; }

#node-info-wos .field { display:flex; align-items:flex-start; margin-bottom:4px; }
#node-info-wos .label { font-weight:bold; min-width:90px; flex-shrink:0; }
#node-info-wos .value { flex:1; word-break:break-word; }


#window-display-oa, #window-display-wos {
  position: fixed;
  top: 10px;
  font-size: 16px;
  font-weight: bold;
  background: rgba(255,255,255,0.85);
  padding: 6px 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  z-index: 9999;
}
#window-display-oa { right: calc(55% - 90px); }
#window-display-wos { left: calc(100% - 110px); }

#info-container-oa, #info-container-wos {
  position: fixed;
  top: 50px;
  display: flex;
  flex-direction: column;
  z-index: 9999;
}
#info-container-oa { left: 20px; }
#info-container-wos { left: calc(50% + 20px); }

#info-container-oa > div, #info-container-wos > div {
  font-size: 14px;
  font-weight: bold;
  background: rgba(255, 255, 255, 0.85);
  padding: 6px 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

#database-title-oa, #database-title-wos {
  position: fixed;
  top: 10px;
  font-size: 16px;
  font-weight: bold;
  background: rgba(255,255,255,0.85);
  padding: 6px 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  z-index: 9999;

}

#database-title-oa {
  left: calc(25% - 60px);
}

#database-title-wos {
  left: calc(75% - 50px);
}


#toggle-labels {
  position: fixed;
  top: 12px;
  right: 150px;
  z-index: 1000;
  padding: 6px 12px;
  font-size: 12px;
}
</style>
  <script type="module" crossorigin src="/game_theory_db_comparison/assets/index-d644886d.js"></script>
</head>

<div id="layout" style="display:flex; height:calc(100vh - 110px);">
  <div id="sigma-oa" style="flex:1; position:relative;"></div>
  <div id="sigma-wos" style="flex:1; position:relative; border-left:2px solid #ccc;"></div>
</div>


<div id="database-title-oa">OpenAlex</div>

<div id="window-display-oa"></div>
<div id="info-container-oa">
  <div id="node-display-oa"></div>
  <div id="edge-display-oa"></div>
</div>

<div id="database-title-wos">Web of Science</div>


<div id="window-display-wos"></div>
<div id="info-container-wos">
  <div id="node-display-wos"></div>
  <div id="edge-display-wos"></div>
</div>


<!-- Toggle Labels Button -->
<button id="toggle-labels">Toggle Labels</button>

<div id="edge-legend" style="position: fixed; bottom: 150px; left: 20px; 
    background: rgba(255,255,255,0.9); padding: 10px; border:1px solid #ccc; 
    border-radius:6px; font-size:12px; width:150px;">
  <b>Normalized Edge Weight</b>
  <div style="height: 20px; width: 100%; 
      background: linear-gradient(to right, #FAFAFA, #000000); margin:5px 0;"></div>
  <div style="display:flex; justify-content: space-between; font-size:10px;">
    <span>0</span>
    <span id="legend-max">1</span>
  </div>
</div>


<div id="window-controls">
  <div id="window-slider-container">
    <div id="slider-line"></div>
    <div id="slider-points"></div>
  </div>
</div>

<div id="node-info-oa">
<div id="node-details-oa"></div>
<div id="topic-donut-oa" style="width: 100%; height: 250px; margin-top:10px;"></div>
</div>

<div id="node-info-wos">

<div id="topic-donut-wos" style="width: 100%; height: 250px; margin-top:10px;"></div>
</div>

</html>
